<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Revenue Coach</title>
  <desc id="desc">Move the bottleneck and create real market evidence with eleven adaptive Agent Skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#111B36"/>
      <stop offset="1" stop-color="#15103A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#54E0B5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#grid)"/>
  <circle cx="1075" cy="55" r="190" fill="#6C63FF" opacity="0.08"/>
  <circle cx="1010" cy="425" r="240" fill="#00B894" opacity="0.06"/>

  <g transform="translate(64 58)">
    <rect width="257" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <circle cx="18" cy="16" r="5" fill="#54E0B5"/>
    <text x="33" y="21" fill="#C9C5FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">REVENUE-FIRST COACHING OS</text>

    <text x="0" y="103" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.6">Move the bottleneck.</text>
    <text x="0" y="163" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.6">Create real evidence.</text>

    <text x="0" y="213" fill="#B9C2D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Eleven adaptive Agent Skills for coaching and execution—</text>
    <text x="0" y="241" fill="#B9C2D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">matched to your ability, ownership, and real market.</text>

    <g transform="translate(0 284)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">
      <rect width="112" height="34" rx="17" fill="#6C63FF" fill-opacity="0.22" stroke="#8B7CFF" stroke-opacity="0.65"/>
      <text x="19" y="22" fill="#D8D4FF">⚡ CASH NOW</text>
      <rect x="124" width="112" height="34" rx="17" fill="#00B894" fill-opacity="0.16" stroke="#54E0B5" stroke-opacity="0.58"/>
      <text x="143" y="22" fill="#B8F4E2">↻ STABILIZE</text>
      <rect x="248" width="90" height="34" rx="17" fill="#F4B942" fill-opacity="0.14" stroke="#F4B942" stroke-opacity="0.58"/>
      <text x="268" y="22" fill="#FFE2A1">↗ BUILD</text>
    </g>

    <text x="0" y="371" fill="#7F8AA5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Open Agent Skills standard  •  Human approval at every external step</text>
  </g>

  <g transform="translate(700 78)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="434" height="312" rx="24" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="28" y="38" fill="#8C97B0" font-size="12" font-weight="700" letter-spacing="1.7">EVIDENCE PATH</text>

    <path d="M58 89 H194 C222 89 224 139 252 139 H372" fill="none" stroke="#6C63FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M372 139 V218 H58" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

    <g font-size="11" font-weight="700" text-anchor="middle">
      <g transform="translate(58 89)">
        <circle r="19" fill="#211E52" stroke="#8B7CFF" stroke-width="2"/>
        <text y="4" fill="#D8D4FF">1</text>
        <text y="39" fill="#AAB3CA">LEAD</text>
      </g>
      <g transform="translate(194 89)">
        <circle r="19" fill="#211E52" stroke="#8B7CFF" stroke-width="2"/>
        <text y="4" fill="#D8D4FF">2</text>
        <text y="39" fill="#AAB3CA">TALK</text>
      </g>
      <g transform="translate(252 139)">
        <circle r="19" fill="#211E52" stroke="#8B7CFF" stroke-width="2"/>
        <text y="4" fill="#D8D4FF">3</text>
        <text y="39" fill="#AAB3CA">OFFER</text>
      </g>
      <g transform="translate(372 139)">
        <circle r="24" fill="#073D33" stroke="#54E0B5" stroke-width="3"/>
        <text y="4" fill="#C1F7E7" font-size="12">4</text>
        <text y="45" fill="#7EE7C8">PAID</text>
      </g>
      <g transform="translate(372 218)">
        <circle r="19" fill="#073D33" stroke="#54E0B5" stroke-width="2"/>
        <text y="4" fill="#C1F7E7">5</text>
        <text y="39" fill="#AAB3CA">DELIVER</text>
      </g>
      <g transform="translate(218 218)">
        <circle r="19" fill="#4D3508" stroke="#F4B942" stroke-width="2"/>
        <text y="4" fill="#FFE2A1">6</text>
        <text y="39" fill="#AAB3CA">RESULT</text>
      </g>
      <g transform="translate(58 218)">
        <circle r="19" fill="#4D3508" stroke="#F4B942" stroke-width="2"/>
        <text y="4" fill="#FFE2A1">7</text>
        <text y="39" fill="#AAB3CA">REPEAT</text>
      </g>
    </g>

    <rect x="28" y="273" width="378" height="1" fill="#FFFFFF" opacity="0.1"/>
    <circle cx="39" cy="291" r="4" fill="#54E0B5"/>
    <text x="52" y="296" fill="#AAB3CA" font-size="12">Move the earliest blocked stage—then learn.</text>
  </g>
</svg>
