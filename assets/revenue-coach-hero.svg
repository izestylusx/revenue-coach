<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Revenue Coach</title>
  <desc id="desc">Move the bottleneck and create real market evidence with eleven adaptive Agent Skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#111B36"/>
      <stop offset="1" stop-color="#15103A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#54E0B5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#grid)"/>
  <circle cx="1075" cy="55" r="190" fill="#6C63FF" opacity="0.08"/>
  <circle cx="1010" cy="425" r="240" fill="#00B894" opacity="0.06"/>

  <g transform="translate(64 58)">
    <rect width="320" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <circle cx="19" cy="16" r="5" fill="#54E0B5"/>
    <text x="180" y="21" text-anchor="middle" fill="#C9C5FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">REVENUE-FIRST COACHING OS</text>

    <text x="0" y="103" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.6">Move the bottleneck.</text>
    <text x="0" y="163" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.6">Create real evidence.</text>

    <text x="0" y="213" fill="#B9C2D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Eleven adaptive Agent Skills for coaching and execution—</text>
    <text x="0" y="241" fill="#B9C2D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">matched to your ability, ownership, and real market.</text>

    <g transform="translate(0 284)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.45" text-anchor="middle">
      <g>
        <rect width="116" height="36" rx="18" fill="#6C63FF" fill-opacity="0.22" stroke="#8B7CFF" stroke-opacity="0.65"/>
        <text x="58" y="23" fill="#D8D4FF">CASH NOW</text>
      </g>
      <g transform="translate(128 0)">
        <rect width="126" height="36" rx="18" fill="#00B894" fill-opacity="0.16" stroke="#54E0B5" stroke-opacity="0.58"/>
        <text x="63" y="23" fill="#B8F4E2">STABILIZE</text>
      </g>
      <g transform="translate(266 0)">
        <rect width="88" height="36" rx="18" fill="#F4B942" fill-opacity="0.14" stroke="#F4B942" stroke-opacity="0.58"/>
        <text x="44" y="23" fill="#FFE2A1">BUILD</text>
      </g>
    </g>

    <text x="0" y="371" fill="#7F8AA5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Open Agent Skills standard  •  Human approval at every external step</text>
  </g>

  <g transform="translate(700 78)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="434" height="312" rx="24" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="28" y="38" fill="#8C97B0" font-size="12" font-weight="700" letter-spacing="1.7">EVIDENCE PATH</text>

    <path d="M68 97 H365" fill="none" stroke="#756BFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M365 97 V197 H68" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-weight="700">
      <g transform="translate(28 76)">
        <rect width="80" height="42" rx="12" fill="#211E52" stroke="#8B7CFF" stroke-width="1.5"/>
        <circle cx="17" cy="21" r="10" fill="#8B7CFF" fill-opacity="0.2"/>
        <text x="17" y="25" text-anchor="middle" fill="#D8D4FF" font-size="11">1</text>
        <text x="53" y="25" text-anchor="middle" fill="#D8D4FF" font-size="10.5" letter-spacing="0.3">LEAD</text>
      </g>
      <g transform="translate(127 76)">
        <rect width="80" height="42" rx="12" fill="#211E52" stroke="#8B7CFF" stroke-width="1.5"/>
        <circle cx="17" cy="21" r="10" fill="#8B7CFF" fill-opacity="0.2"/>
        <text x="17" y="25" text-anchor="middle" fill="#D8D4FF" font-size="11">2</text>
        <text x="53" y="25" text-anchor="middle" fill="#D8D4FF" font-size="10.5" letter-spacing="0.3">TALK</text>
      </g>
      <g transform="translate(226 76)">
        <rect width="80" height="42" rx="12" fill="#211E52" stroke="#8B7CFF" stroke-width="1.5"/>
        <circle cx="17" cy="21" r="10" fill="#8B7CFF" fill-opacity="0.2"/>
        <text x="17" y="25" text-anchor="middle" fill="#D8D4FF" font-size="11">3</text>
        <text x="53" y="25" text-anchor="middle" fill="#D8D4FF" font-size="10.5" letter-spacing="0.2">OFFER</text>
      </g>
      <g transform="translate(325 76)">
        <rect width="80" height="42" rx="12" fill="#073D33" stroke="#54E0B5" stroke-width="2"/>
        <circle cx="17" cy="21" r="10" fill="#54E0B5" fill-opacity="0.2"/>
        <text x="17" y="25" text-anchor="middle" fill="#C1F7E7" font-size="11">4</text>
        <text x="53" y="25" text-anchor="middle" fill="#C1F7E7" font-size="10.5" letter-spacing="0.3">PAID</text>
      </g>
      <g transform="translate(325 176)">
        <rect width="80" height="42" rx="12" fill="#073D33" stroke="#54E0B5" stroke-width="1.5"/>
        <circle cx="17" cy="21" r="10" fill="#54E0B5" fill-opacity="0.2"/>
        <text x="17" y="25" text-anchor="middle" fill="#C1F7E7" font-size="11">5</text>
        <text x="53" y="25" text-anchor="middle" fill="#C1F7E7" font-size="9.5" letter-spacing="0.1">DELIVER</text>
      </g>
      <g transform="translate(127 176)">
        <rect width="80" height="42" rx="12" fill="#4D3508" stroke="#F4B942" stroke-width="1.5"/>
        <circle cx="17" cy="21" r="10" fill="#F4B942" fill-opacity="0.18"/>
        <text x="17" y="25" text-anchor="middle" fill="#FFE2A1" font-size="11">6</text>
        <text x="53" y="25" text-anchor="middle" fill="#FFE2A1" font-size="10" letter-spacing="0.15">RESULT</text>
      </g>
      <g transform="translate(28 176)">
        <rect width="80" height="42" rx="12" fill="#4D3508" stroke="#F4B942" stroke-width="1.5"/>
        <circle cx="17" cy="21" r="10" fill="#F4B942" fill-opacity="0.18"/>
        <text x="17" y="25" text-anchor="middle" fill="#FFE2A1" font-size="11">7</text>
        <text x="53" y="25" text-anchor="middle" fill="#FFE2A1" font-size="10" letter-spacing="0.1">REPEAT</text>
      </g>
    </g>

    <rect x="28" y="260" width="378" height="1" fill="#FFFFFF" opacity="0.1"/>
    <circle cx="39" cy="285" r="4" fill="#54E0B5"/>
    <text x="52" y="290" fill="#AAB3CA" font-size="12">Move the earliest blocked stage—then learn.</text>
  </g>
</svg>
